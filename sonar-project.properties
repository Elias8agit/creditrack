# Configuración del análisis en SonarCloud (lo ejecuta el pipeline de GitHub Actions)
sonar.projectKey=Elias8agit_creditrack
sonar.organization=elias8agit
sonar.projectName=CrediTrack

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.sourceEncoding=UTF-8

# Cobertura generada por Jest (backend) y Vitest (frontend) en la etapa de pruebas unitarias
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# La cobertura unitaria se mide sobre la lógica de negocio (módulos críticos del E2). Se excluyen del cálculo:
# la capa de presentación (pantallas React), el arranque/rutas HTTP y el acceso a datos, que se verifican
# con las pruebas de API (Newman) y no con pruebas unitarias.
sonar.coverage.exclusions=frontend/src/pages/**,frontend/src/App.jsx,frontend/src/main.jsx,backend/src/routes/**,backend/src/db/**,backend/src/app.js,backend/src/server.js
