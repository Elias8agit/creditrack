# Base de datos local para desarrollo: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creditrack
    ports:
      - "5432:5432"
    volumes:
      - creditrack-data:/var/lib/postgresql/data
volumes:
  creditrack-data:
